name: Release qualitour-site
run-name: Site release · ${{ github.event_name }} · ${{ github.actor }}

# Rebuilds and deploys the static public site (Worker `qualitour-site`) from the CMS's published content.
# Started by the CMS pages-rebuild plugin (workflow_dispatch through the GitHub API) when a tour is published,
# unpublished or deleted; it can also be run by hand. GitHub only dispatches workflows that exist on the default
# branch, so this file lives on main and builds the code of SITE_SOURCE_REF.
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; GitHub keeps only the newest waiting run, so a burst of CMS edits collapses into one
# follow-up build instead of a queue. A running release is never interrupted.
concurrency:
  group: qualitour-site-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QUALITOUR_CMS_ORIGIN: https://qualitour.qualitour.workers.dev
      SITE_SOURCE_REF: ${{ vars.SITE_SOURCE_REF || 'codex/emdash-native-site-20261112' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SITE_SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore derived-image cache
        uses: actions/cache@v4
        with:
          path: .astro/site-images
          key: site-images-v1-${{ github.run_id }}
          restore-keys: |
            site-images-v1-
      - name: Test the release safeguards
        run: |
          node scripts/test-site-worker.mjs
          node cms/scripts/test-pages-rebuild-notifier.mjs
      - name: Build the static site from the published content
        env:
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
          SITE_BUILD_KEY: ${{ secrets.SITE_BUILD_KEY }}
        run: npm run release:site
      - name: Deploy qualitour-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The Workers-Editor token cannot read the account's workers.dev subdomain, which `wrangler deploy` does
        # at the end. Uploading a version and deploying it to 100% needs no such read and changes no routes.
        run: |
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          npx wrangler versions upload --config wrangler.site.jsonc --message "site-release run ${{ github.run_id }}"
          version=$(node -e "const rows=require('fs').readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH,'utf8').trim().split('\n').map(line=>JSON.parse(line)); console.log(rows.find(row=>row.type==='version-upload').version_id)")
          test -n "$version"
          npx wrangler versions deploy "$version@100%" --config wrangler.site.jsonc --yes
      - name: Verify the live site against the release
        run: |
          pages=$(node -e "console.log(require('./.astro/site-release/assets/site-release.json').pages)")
          for path in / /zh /tours /book; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://qualitour-site.qualitour.workers.dev$path")
            echo "$path $code"
            test "$code" = 200
          done
          echo "Released $pages pages" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-release-${{ github.run_id }}
          path: .astro/site-release/assets/site-release.json
          if-no-files-found: ignore
          retention-days: 14
