name: Deploy to cPanel Staging
run-name: Staging · ${{ inputs.trigger || github.event_name }}

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: 'What triggered this deploy'
        required: false
        default: 'manual'
      slug:
        description: 'Changed post slug (retained for WordPress webhook compatibility)'
        required: false
        default: ''
      post_type:
        description: 'Changed post type (retained for WordPress webhook compatibility)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

# Never interrupt a publication half-way or let two runs overwrite each other.
concurrency:
  group: qualitour-cpanel-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: staging
      ASTRO_BUILD_TIMINGS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm version
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-astro-images-v1-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-astro-images-v1-${{ hashFiles('package-lock.json') }}-
      - name: Test release safeguards
        run: npm run test:staging
      - name: Check source types
        run: npm run check
      - name: Build current CMS content
        env:
          EMDASH_TOKEN: ${{ secrets.EMDASH_TOKEN }}
        run: npm run build:cpanel
      - name: Verify catalogues, detail pages and shared transfers
        run: python3 scripts/staging_release.py verify
      - name: Back up and publish changed files
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/staging_release.py deploy
      - name: Verify public staging
        run: python3 scripts/staging_release.py smoke
      - name: Preserve release and recovery files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.run_id }}
          path: |
            staging-backup/
            dist/qualitour-release.json
          include-hidden-files: true
          retention-days: 14
      - name: Write release summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = Path('dist/qualitour-release.json')
          if manifest.exists():
              data = json.loads(manifest.read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write(f"Commit: `{data['commit']}`\n\n")
                  summary.write(' | '.join(f"{lang}: {value['count']} tours" for lang, value in data['tours'].items()) + '\n\n')
                  summary.write(f"Files: {len(data['files'])}. Step timings appear in this run. Recovery files retained for 14 days.\n")
          PY
